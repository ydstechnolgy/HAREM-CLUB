# HAREM CLUB · Sync Streams PowerSync
# A coller dans PowerSync > Sync Streams, puis Validate et Deploy.
#
# - Tout membre actif reçoit le menu, les tables du club et la soirée.
# - Une serveuse reçoit seulement ses notes de la soirée en cours.
# - Le patron et le gérant reçoivent tout, sauf les prix d'achat et les coûts
#   (lus par les rapports du serveur).

config:
  edition: 3

streams:
  menu_et_soiree:
    auto_subscribe: true
    queries:
      - SELECT * FROM settings WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true)
      - SELECT * FROM club_tables WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true)
      - SELECT * FROM categories WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true)
      - SELECT id, club, category_id, name, sale_price, track_stock, min_stock, active, sort_order, created_at, updated_at FROM products WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true)
      - SELECT * FROM nights WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true)

  ma_fiche:
    auto_subscribe: true
    query: SELECT id, club, user_id, login, role, display_name, phone, active, created_at FROM members WHERE user_id = auth.user_id()

  mes_notes:
    auto_subscribe: true
    query: SELECT * FROM tabs WHERE waitress_id IN (SELECT id FROM members WHERE user_id = auth.user_id() AND active = true) AND night_id IN (SELECT id FROM nights WHERE status = 'open')

  mes_boissons:
    auto_subscribe: true
    query: SELECT id, club, tab_id, product_id, product_name, quantity, unit_price, status, requested_at, requested_by, served_by, served_at, removed_by, removed_at, removed_reason FROM tab_items WHERE tab_id IN (SELECT id FROM tabs WHERE waitress_id IN (SELECT id FROM members WHERE user_id = auth.user_id() AND active = true) AND night_id IN (SELECT id FROM nights WHERE status = 'open'))

  mes_paiements:
    auto_subscribe: true
    query: SELECT * FROM payments WHERE tab_id IN (SELECT id FROM tabs WHERE waitress_id IN (SELECT id FROM members WHERE user_id = auth.user_id() AND active = true) AND night_id IN (SELECT id FROM nights WHERE status = 'open'))

  gestion:
    auto_subscribe: true
    queries:
      - SELECT id, club, user_id, login, role, display_name, phone, active, created_at FROM members WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true AND role != 'serveuse')
      - SELECT * FROM tabs WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true AND role != 'serveuse')
      - SELECT id, club, tab_id, product_id, product_name, quantity, unit_price, status, requested_at, requested_by, served_by, served_at, removed_by, removed_at, removed_reason FROM tab_items WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true AND role != 'serveuse')
      - SELECT * FROM payments WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true AND role != 'serveuse')
      - SELECT * FROM cash_movements WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true AND role != 'serveuse')
      - SELECT * FROM expenses WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true AND role != 'serveuse')
      - SELECT * FROM suppliers WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true AND role != 'serveuse')
      - SELECT id, club, product_id, quantity, supplier_id, note, member_id, created_at FROM stock_entries WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true AND role != 'serveuse')
      - SELECT * FROM stock_movements WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true AND role != 'serveuse')
      - SELECT id, club, nb_products, nb_ecarts, note, member_id, created_at FROM inventories WHERE club IN (SELECT club FROM members WHERE user_id = auth.user_id() AND active = true AND role != 'serveuse')
