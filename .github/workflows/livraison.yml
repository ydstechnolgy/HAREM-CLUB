# Fabrique Harem Club sur les serveurs de GitHub et publie une version dans « Releases » :
#   - harem-club.apk                  : application Android
#   - harem-club-ancien-telephone.apk : Android, pour les téléphones anciens (32 bits)
#   - Harem-Club-Installation.exe     : programme d'installation Windows
# Liens toujours à jour :
#   https://github.com/ydstechnolgy/HAREM-CLUB/releases/latest/download/harem-club.apk
#   https://github.com/ydstechnolgy/HAREM-CLUB/releases/latest/download/Harem-Club-Installation.exe
name: Livraison (Android + Windows)

on:
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: # seulement quand l'application change
      - 'lib/**'
      - 'android/**'
      - 'windows/**'
      - 'installateur/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/livraison.yml'

permissions:
  contents: write

env:
  # Numéro de version : 1.0.<numéro de fabrication>. (+100 : marge pour
  # les numéros Android)
  NUMERO: ${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Signature définitive : utilisée seulement si les secrets existent.
      - name: Signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > android/app/haremclub.jks
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          keytool -list -keystore android/app/haremclub.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 || echo "::error::La clé Android ou son mot de passe ne correspond pas (secrets GitHub)."
          cat > android/key.properties <<PROPS
          storeFile=haremclub.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=haremclub
          PROPS

      - run: flutter pub get
      - name: Fabrication de l'APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --build-name=1.0.$NUMERO --build-number=$((NUMERO + 100)) 2>&1 | tee apk.txt || {
            # Les erreurs deviennent des annotations lisibles sur GitHub
            grep -iE -A3 'what went wrong|error|exception|tampered|password|keystore' apk.txt | grep -v '^\s*$' | head -30 | sed 's/^/::error::/'
            exit 1
          }
      - name: Noms des fichiers
        run: |
          mkdir livraison
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk livraison/harem-club.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk livraison/harem-club-ancien-telephone.apk
          ls -lh livraison
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: livraison/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fabrication du logiciel Windows
        run: flutter build windows --release --build-name=1.0.${{ env.NUMERO }} --build-number=${{ env.NUMERO }}

      # Les bibliothèques Microsoft (Visual C++) sont jointes au logiciel :
      # il démarre ainsi sur n'importe quel PC, même sans rien installer d'autre.
      - name: Bibliothèques Visual C++
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $dest -Force
          }
          Get-ChildItem $dest

      - name: Programme d'installation
        shell: pwsh
        env:
          HAREM_VERSION: 1.0.${{ env.NUMERO }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "installateur\harem_club.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem livraison

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: livraison/Harem-Club-Installation.exe

  publier:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: livraison
          merge-multiple: true
      - run: ls -lh livraison
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.NUMERO }}
          name: Harem Club · version 1.0.${{ env.NUMERO }}
          make_latest: true
          body: |
            **Windows** : Harem-Club-Installation.exe — à ouvrir sur le PC, puis suivre l'assistant.
            **Android** : harem-club.apk — pour la plupart des téléphones ;
            harem-club-ancien-telephone.apk seulement si le premier ne s'installe pas.
          files: livraison/*
